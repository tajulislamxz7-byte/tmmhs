<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — Premium Search</title>
<style>
  /* ============================================================
     TOKENS
  ============================================================ */
  :root{
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
    --accent-1: #7C93FF;
    --accent-2: #B87CFF;
    --accent-grad: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    --radius-pill: 999px;
    --radius-lg: 20px;
    --radius-md: 14px;
    --ease-out: cubic-bezier(.16,1,.3,1);
    --ease-soft: cubic-bezier(.4,0,.2,1);
    --dur-fast: .18s;
    --dur-med: .38s;
    --dur-slow: .55s;

    /* category accents */
    --cat-overview:#7C93FF;
    --cat-academic:#4FB4FF;
    --cat-management:#FFB35C;
    --cat-finance:#4FDCB0;
    --cat-system:#C792EA;
    --cat-communication:#FF86A8;
  }

  [data-theme="dark"]{
    --bg-0:#0a0c14;
    --bg-1:#0d1020;
    --bg-2:#131730;
    --glass-bg: rgba(255,255,255,0.055);
    --glass-bg-strong: rgba(255,255,255,0.09);
    --glass-border: rgba(255,255,255,0.11);
    --glass-border-strong: rgba(255,255,255,0.18);
    --text-1: rgba(255,255,255,0.94);
    --text-2: rgba(255,255,255,0.62);
    --text-3: rgba(255,255,255,0.38);
    --shadow-color: 0,0,0;
    --panel-bg: rgba(18,20,36,0.78);
    --input-caret: #ffffff;
  }
  [data-theme="light"]{
    --bg-0:#eef0f7;
    --bg-1:#e7eaf5;
    --bg-2:#dfe3f2;
    --glass-bg: rgba(255,255,255,0.55);
    --glass-bg-strong: rgba(255,255,255,0.75);
    --glass-border: rgba(20,22,40,0.08);
    --glass-border-strong: rgba(20,22,40,0.14);
    --text-1: rgba(18,20,36,0.92);
    --text-2: rgba(18,20,36,0.58);
    --text-3: rgba(18,20,36,0.38);
    --shadow-color: 30,34,70;
    --panel-bg: rgba(255,255,255,0.85);
    --input-caret: #4a4de0;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family: var(--font);
    background:
      radial-gradient(circle at 18% 15%, rgba(124,147,255,0.16), transparent 42%),
      radial-gradient(circle at 82% 78%, rgba(184,124,255,0.14), transparent 45%),
      var(--bg-0);
    color: var(--text-1);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    transition: background var(--dur-med) var(--ease-soft), color var(--dur-med) var(--ease-soft);
  }
  ::selection{ background: rgba(124,147,255,.35); }

  /* subtle floating orbs for depth */
  .orb{ position:fixed; border-radius:50%; filter: blur(70px); pointer-events:none; z-index:0; opacity:.55; }
  .orb-a{ width:380px; height:380px; top:-120px; left:-100px; background: var(--accent-1); animation: floatSlow 14s ease-in-out infinite; }
  .orb-b{ width:420px; height:420px; bottom:-160px; right:-120px; background: var(--accent-2); animation: floatSlow 16s ease-in-out infinite reverse; }
  @keyframes floatSlow{ 0%,100%{ transform: translate(0,0);} 50%{ transform: translate(24px,-18px);} }

  /* ============================================================
     THEME TOGGLE (demo affordance)
  ============================================================ */
  .theme-toggle{
    position:fixed; top:20px; right:20px; z-index:50;
    width:42px; height:42px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: var(--glass-bg); border:1px solid var(--glass-border);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    color: var(--text-1); cursor:pointer;
    transition: transform var(--dur-fast) var(--ease-out), background var(--dur-fast), border-color var(--dur-fast);
  }
  .theme-toggle:hover{ transform: scale(1.08) rotate(12deg); }
  .theme-toggle:active{ transform: scale(.92); }
  .theme-toggle svg{ width:19px; height:19px; }
  .theme-toggle .icon-moon{ display:none; }
  [data-theme="light"] .theme-toggle .icon-sun{ display:none; }
  [data-theme="light"] .theme-toggle .icon-moon{ display:block; }

  /* ============================================================
     SCENE / HERO CONTEXT
  ============================================================ */
  .scene{
    position:relative; z-index:1;
    width:100%; max-width:640px;
    padding: 32px 20px 120px;
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
  }
  .eyebrow{
    font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    color: var(--text-2); margin-bottom:14px;
    display:inline-flex; align-items:center; gap:8px;
  }
  .eyebrow::before{
    content:""; width:6px; height:6px; border-radius:50%; background: var(--accent-grad);
    box-shadow: 0 0 10px var(--accent-1);
  }
  .scene h1{
    font-size: clamp(28px, 5vw, 42px);
    line-height:1.12;
    font-weight:700;
    letter-spacing:-0.02em;
    margin: 0 0 34px;
    background: linear-gradient(180deg, var(--text-1), var(--text-2));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }

  /* ============================================================
     SEARCH ROOT / SHELL
  ============================================================ */
  .search-root{
    position:relative;
    display:inline-block;
    z-index:10;
  }

  .search-shell{
    position:relative;
    display:flex;
    align-items:center;
    height:56px;
    width:56px;
    border-radius: var(--radius-pill);
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    box-shadow:
      0 8px 30px -8px rgba(var(--shadow-color), .45),
      inset 0 1px 0 rgba(255,255,255,0.06);
    overflow:hidden;
    transition:
      width var(--dur-slow) var(--ease-out),
      background var(--dur-med) var(--ease-soft),
      border-color var(--dur-med) var(--ease-soft),
      box-shadow var(--dur-med) var(--ease-soft);
    cursor: pointer;
  }
  .search-shell.expanded{
    width: min(560px, 88vw);
    cursor: default;
    background: var(--glass-bg-strong);
  }
  .search-shell.expanded:focus-within{
    border-color: rgba(124,147,255,.55);
    box-shadow:
      0 10px 34px -8px rgba(var(--shadow-color), .5),
      0 0 0 4px rgba(124,147,255,.16),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .search-shell.typing-glow{ animation: glowPulse .55s var(--ease-soft); }
  @keyframes glowPulse{
    0%{ box-shadow: 0 10px 34px -8px rgba(var(--shadow-color),.5), 0 0 0 0 rgba(124,147,255,.4), inset 0 1px 0 rgba(255,255,255,.08); }
    100%{ box-shadow: 0 10px 34px -8px rgba(var(--shadow-color),.5), 0 0 0 10px rgba(124,147,255,0), inset 0 1px 0 rgba(255,255,255,.08); }
  }

  .search-toggle-icon{
    flex: 0 0 56px;
    width:56px; height:56px;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-1);
    background:none; border:none; padding:0; margin:0;
    cursor:pointer;
    position:relative;
    z-index:2;
  }
  .search-toggle-icon svg{
    width:20px; height:20px;
    transition: transform var(--dur-med) var(--ease-out);
  }
  .search-shell:not(.expanded):hover .search-toggle-icon svg{ transform: rotate(-14deg) scale(1.08); }
  .search-shell.expanded .search-toggle-icon{ cursor:default; color: var(--text-2); }
  .search-toggle-icon:focus-visible{ outline: 2px solid var(--accent-1); outline-offset: -4px; border-radius:50%; }

  .search-input-wrap{
    display:flex; align-items:center;
    flex: 1 1 auto;
    min-width:0;
    height:100%;
    gap:10px;
    padding-right: 8px;
    opacity:0;
    transition: opacity var(--dur-med) var(--ease-soft) .05s;
  }
  .search-shell.expanded .search-input-wrap{ opacity:1; transition: opacity var(--dur-med) var(--ease-soft) .18s; }

  #searchInput{
    flex:1 1 auto;
    min-width:0;
    height:100%;
    border:none; outline:none; background:transparent;
    font-family: var(--font);
    font-size:16px; font-weight:450;
    letter-spacing:-0.01em;
    color: var(--text-1);
    caret-color: var(--input-caret);
    padding:0;
  }
  #searchInput::placeholder{ color: var(--text-3); transition: opacity var(--dur-fast) ease; }
  #searchInput.ph-fade::placeholder{ opacity:0; }

  .icon-btn{
    flex: 0 0 auto;
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    border:none; background:transparent; color: var(--text-2);
    cursor:pointer; border-radius:50%;
    position:relative; overflow:hidden;
    transition: color var(--dur-fast), background var(--dur-fast), transform var(--dur-fast) var(--ease-out);
  }
  .icon-btn:hover{ background: rgba(127,127,127,.14); color: var(--text-1); }
  .icon-btn:active{ transform: scale(.86); }
  .icon-btn svg{ width:15px; height:15px; }

  .clear-btn{ display:none; }
  .clear-btn.show{ display:flex; animation: popIn .22s var(--ease-out); }
  @keyframes popIn{ from{ opacity:0; transform: scale(.5);} to{ opacity:1; transform: scale(1);} }

  .esc-hint{
    flex:0 0 auto;
    font-size:11px; font-weight:600; color: var(--text-3);
    border: 1px solid var(--glass-border-strong);
    padding: 3px 7px; border-radius:6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    transition: opacity var(--dur-fast) ease;
  }
  @media (max-width: 640px){ .esc-hint{ display:none; } }

  /* ============================================================
     PANELS (suggestions + results)
  ============================================================ */
  .panel{
    position:absolute;
    top: calc(100% + 12px);
    left:0; right:0;
    background: var(--panel-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    box-shadow: 0 22px 50px -12px rgba(var(--shadow-color), .55), inset 0 1px 0 rgba(255,255,255,.06);
    overflow:hidden;
    opacity:0;
    transform: translateY(-10px) scale(.97);
    transform-origin: top center;
    pointer-events:none;
    transition: opacity var(--dur-med) var(--ease-out), transform var(--dur-med) var(--ease-out);
    z-index: 20;
    max-height: min(420px, 60vh);
    display:flex; flex-direction:column;
  }
  .panel.show{
    opacity:1; transform: translateY(0) scale(1);
    pointer-events:auto;
  }

  /* ---- suggestions ---- */
  #suggestPanel .sugg-list{ overflow-y:auto; padding:8px; }
  .sugg-item{
    display:flex; align-items:center; gap:12px;
    padding:10px 12px;
    border-radius: var(--radius-md);
    cursor:pointer;
    position:relative; overflow:hidden;
    transition: background var(--dur-fast) var(--ease-soft), transform .12s var(--ease-out);
  }
  .sugg-item:hover, .sugg-item.active{
    background: rgba(124,147,255,.13);
  }
  .sugg-item:active{ transform: scale(.985); }
  .sugg-icon{
    flex:0 0 34px; width:34px; height:34px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    color: var(--accent);
  }
  .sugg-icon svg{ width:16px; height:16px; }
  .sugg-text{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:1px; text-align:left; }
  .sugg-title{ font-size:14.5px; font-weight:600; color: var(--text-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sugg-title mark{ background:transparent; color: var(--accent-1); font-weight:700; }
  [data-theme="light"] .sugg-title mark{ color:#5b5ee0; }
  .sugg-sub{ font-size:12px; color: var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sugg-badge{
    flex:0 0 auto; font-size:10.5px; font-weight:700; letter-spacing:.02em;
    padding:4px 9px; border-radius: var(--radius-pill);
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--accent);
  }
  .no-sugg{ padding: 22px 16px; text-align:center; color: var(--text-3); font-size:13px; }

  /* ---- results header ---- */
  .results-header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--glass-border);
    flex: 0 0 auto;
  }
  .results-header span{ font-size:12.5px; font-weight:600; color: var(--text-2); }
  .results-header span b{ color: var(--text-1); }
  .panel-close{
    width:26px; height:26px; border-radius:50%; border:none;
    background: rgba(127,127,127,.14); color: var(--text-2);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:15px; line-height:1;
    transition: background var(--dur-fast), color var(--dur-fast), transform .12s;
  }
  .panel-close:hover{ background: rgba(255,90,90,.16); color:#ff6a6a; }
  .panel-close:active{ transform: scale(.85); }

  .results-list{ overflow-y:auto; padding:10px 12px 14px; display:flex; flex-direction:column; gap:8px; }

  .result-card{
    display:flex; align-items:flex-start; gap:12px;
    padding: 12px 12px;
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    background: rgba(127,127,127,.05);
    cursor:pointer;
    position:relative; overflow:hidden;
    opacity:0; transform: translateY(14px);
    transition: background var(--dur-fast) var(--ease-soft), border-color var(--dur-fast), box-shadow var(--dur-fast), transform .18s var(--ease-out);
  }
  .result-card.stagger-in{ animation: staggerUp .46s var(--ease-out) forwards; }
  @keyframes staggerUp{ to{ opacity:1; transform: translateY(0); } }
  .result-card:hover{
    background: rgba(127,127,127,.11);
    border-color: var(--glass-border-strong);
    box-shadow: 0 10px 24px -10px rgba(var(--shadow-color), .5);
    transform: translateY(-2px);
  }
  .result-card:active{ transform: translateY(0) scale(.985); }
  .result-icon{
    flex:0 0 40px; width:40px; height:40px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background: color-mix(in srgb, var(--accent) 18%, transparent);
    color: var(--accent);
  }
  .result-icon svg{ width:18px; height:18px; }
  .result-body{ flex:1 1 auto; min-width:0; text-align:left; }
  .result-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .result-title{ margin:0; font-size:15px; font-weight:650; color: var(--text-1); letter-spacing:-0.01em; }
  .result-badge{
    font-size:10px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    padding:2.5px 8px; border-radius: var(--radius-pill);
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--accent);
  }
  .result-desc{ margin:3px 0 0; font-size:13px; color: var(--text-2); line-height:1.4; }
  .result-arrow{ flex:0 0 auto; color: var(--text-3); font-size:16px; align-self:center; opacity:0; transform: translateX(-4px); transition: all var(--dur-fast) var(--ease-out); }
  .result-card:hover .result-arrow{ opacity:1; transform: translateX(0); color: var(--accent-1); }

  /* ---- loading state ---- */
  .state-loading{ padding: 46px 20px; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .loading-dots{ display:flex; gap:7px; }
  .loading-dots span{
    width:9px; height:9px; border-radius:50%;
    background: var(--accent-grad);
    animation: pulseDot 1.1s ease-in-out infinite;
  }
  .loading-dots span:nth-child(2){ animation-delay: .15s; }
  .loading-dots span:nth-child(3){ animation-delay: .3s; }
  @keyframes pulseDot{ 0%,80%,100%{ transform: scale(.55); opacity:.4; } 40%{ transform: scale(1); opacity:1; } }
  .state-loading p{ margin:0; font-size:13px; color: var(--text-3); font-weight:500; }

  /* ---- empty state ---- */
  .state-empty{ padding: 34px 26px 30px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; }
  .empty-icon{
    width:56px; height:56px; border-radius:50%; margin-bottom:6px;
    display:flex; align-items:center; justify-content:center;
    background: rgba(124,147,255,.12); color: var(--accent-1);
    animation: floatIcon 3s ease-in-out infinite;
  }
  .empty-icon svg{ width:26px; height:26px; }
  @keyframes floatIcon{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-6px); } }
  .state-empty h4{ margin:2px 0 0; font-size:15.5px; font-weight:650; color: var(--text-1); }
  .state-empty p{ margin:2px 0 12px; font-size:13px; color: var(--text-3); max-width:320px; line-height:1.5; }
  .empty-suggestions{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; justify-content:center; }
  .empty-suggestions span{ font-size:12px; color: var(--text-3); margin-right:2px; }
  .chip{
    font-size:12.5px; font-weight:600; color: var(--text-1);
    background: rgba(127,127,127,.12); border:1px solid var(--glass-border-strong);
    padding:6px 12px; border-radius: var(--radius-pill); cursor:pointer;
    position:relative; overflow:hidden;
    transition: background var(--dur-fast), transform .12s var(--ease-out), border-color var(--dur-fast);
  }
  .chip:hover{ background: rgba(124,147,255,.16); border-color: rgba(124,147,255,.4); transform: translateY(-1px); }
  .chip:active{ transform: translateY(0) scale(.95); }

  /* ripple */
  .ripple{
    position:absolute; border-radius:50%;
    background: rgba(255,255,255,.28);
    transform: scale(0);
    animation: rippleAnim .6s ease-out;
    pointer-events:none;
  }
  [data-theme="light"] .ripple{ background: rgba(70,70,120,.16); }
  @keyframes rippleAnim{ to{ transform: scale(1); opacity:0; } }

  /* scrollbars */
  .sugg-list::-webkit-scrollbar, .results-list::-webkit-scrollbar{ width:8px; }
  .sugg-list::-webkit-scrollbar-thumb, .results-list::-webkit-scrollbar-thumb{
    background: rgba(127,127,127,.28); border-radius:8px; border: 2px solid transparent; background-clip: padding-box;
  }

  .hint{ margin-top:26px; font-size:13px; color: var(--text-3); }
  .hint kbd{
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--glass-bg); border:1px solid var(--glass-border-strong);
    padding:2px 7px; border-radius:6px; font-size:12px; color: var(--text-2);
  }

  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .001s !important; transition-duration: .001s !important; }
  }
</style>
</head>
<body data-theme="dark">

  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark and light mode">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
  </button>

  <main class="scene">
    <span class="eyebrow">Meridian Campus OS</span>
    <h1>Find anything,<br>instantly.</h1>

    <div class="search-root" id="searchRoot">
      <form class="search-shell" id="searchShell" role="search" aria-label="Site search">
        <button type="button" class="search-toggle-icon" id="searchToggle" aria-label="Open search" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <div class="search-input-wrap">
          <input
            type="text"
            id="searchInput"
            role="combobox"
            aria-expanded="false"
            aria-controls="suggestList"
            aria-autocomplete="list"
            aria-label="Search anything"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search anything...">
          <button type="button" class="icon-btn clear-btn" id="clearBtn" aria-label="Clear search" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
          </button>
          <kbd class="esc-hint">esc</kbd>
        </div>
      </form>

      <div class="panel" id="suggestPanel">
        <div class="sugg-list" id="suggestList" role="listbox" aria-label="Search suggestions"></div>
      </div>

      <div class="panel" id="resultsPanel"></div>
    </div>

    <p class="hint">Press <kbd>/</kbd> to search, or try “exam”, “fees”, “library”</p>
  </main>

  <div class="sr-only" id="liveRegion" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------
     THEME
  --------------------------------------------------------- */
  var root = document.documentElement;
  var themeBtn = document.getElementById('themeToggle');
  var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  document.body.setAttribute('data-theme', prefersLight ? 'light' : 'dark');
  themeBtn.addEventListener('click', function(){
    var cur = document.body.getAttribute('data-theme');
    document.body.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  });

  /* ---------------------------------------------------------
     ICONS
  --------------------------------------------------------- */
  var ICONS = {
    grid: '<rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/>',
    users: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.3" cy="9" r="2.3"/><path d="M15.7 14.2c2.6.35 4.6 2.5 4.6 5.3"/>',
    check: '<circle cx="12" cy="12" r="8.5"/><path d="M8 12.4l2.6 2.6L16.2 9"/>',
    edit: '<path d="M4 20h4l10.3-10.3a2.1 2.1 0 0 0-3-3L5 17v3z"/>',
    chart: '<path d="M4 20V11"/><path d="M11 20V4"/><path d="M18 20v-6.5"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.3v5l3.4 2"/>',
    bell: '<path d="M6.2 10.3a5.8 5.8 0 0 1 11.6 0c0 3.9 1.4 5.3 1.4 5.3H4.8s1.4-1.4 1.4-5.3z"/><path d="M9.6 17.8a2.4 2.4 0 0 0 4.8 0"/>',
    book: '<path d="M4.2 5.4A2.4 2.4 0 0 1 6.6 3H20v15.4H6.6a2.4 2.4 0 0 0-2.4 2.4z"/><path d="M4.2 5.4v15.4"/>',
    bus: '<rect x="3" y="5" width="18" height="12" rx="2.4"/><circle cx="7.5" cy="19" r="1.4"/><circle cx="16.5" cy="19" r="1.4"/><path d="M3 11.2h18"/>',
    home: '<path d="M4 11.2L12 4l8 7.2"/><path d="M6 10.2V20h12v-9.8"/>',
    card: '<rect x="3" y="6" width="18" height="13" rx="2.2"/><path d="M3 10.4h18"/>',
    cash: '<rect x="2.4" y="6.5" width="19.2" height="11" rx="2"/><circle cx="12" cy="12" r="2.6"/>',
    wallet: '<path d="M4.2 7.4A2.4 2.4 0 0 1 6.6 5H18a1 1 0 0 1 1 1v2"/><rect x="3" y="8" width="18" height="12" rx="2.3"/><circle cx="16.3" cy="14" r="1.3"/>',
    gear: '<circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.3M12 18.7V21M21 12h-2.3M5.3 12H3M17.9 6.1l-1.6 1.6M7.7 16.3l-1.6 1.6M17.9 17.9l-1.6-1.6M7.7 7.7L6.1 6.1"/>',
    user: '<circle cx="12" cy="8.6" r="3.5"/><path d="M4.6 20a7.4 7.4 0 0 1 14.8 0"/>',
    chat: '<path d="M4 5h16v11.4H8.3L4 20.4z"/>',
    calendar: '<rect x="3.4" y="5" width="17.2" height="15" rx="2.2"/><path d="M3.4 9.6h17.2"/><path d="M8 3v4M16 3v4"/>',
    doc: '<path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4"/><path d="M8.5 13h7M8.5 16.4h7"/>',
    search: '<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
    searchOff: '<circle cx="11" cy="11" r="7.6"/><line x1="21.5" y1="21.5" x2="16.4" y2="16.4"/><line x1="7.6" y1="11" x2="14.4" y2="11"/>'
  };
  function svg(name, extra){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" '+(extra||'')+'>'+ICONS[name]+'</svg>';
  }

  /* ---------------------------------------------------------
     DATA
  --------------------------------------------------------- */
  var DATA = [
    { title:'Dashboard',  subtitle:'Overview of school activity',        category:'Overview',      accent:'var(--cat-overview)',      icon:'grid' },
    { title:'Students',   subtitle:'Manage student records',             category:'Academic',      accent:'var(--cat-academic)',      icon:'users' },
    { title:'Teachers',   subtitle:'Faculty directory & profiles',       category:'Academic',      accent:'var(--cat-academic)',      icon:'users' },
    { title:'Staff',      subtitle:'Non-teaching staff records',         category:'Management',    accent:'var(--cat-management)',    icon:'users' },
    { title:'Attendance', subtitle:'Daily attendance tracking',          category:'Academic',      accent:'var(--cat-academic)',      icon:'check' },
    { title:'Exams',      subtitle:'Schedule and manage examinations',   category:'Academic',      accent:'var(--cat-academic)',      icon:'edit' },
    { title:'Results',    subtitle:'Student performance and grades',     category:'Academic',      accent:'var(--cat-academic)',      icon:'chart' },
    { title:'Routine',    subtitle:'Class timetables and schedules',     category:'Academic',      accent:'var(--cat-academic)',      icon:'clock' },
    { title:'Notice',     subtitle:'Announcements and circulars',        category:'Communication', accent:'var(--cat-communication)', icon:'bell' },
    { title:'Library',    subtitle:'Books, catalog and issued items',    category:'Academic',      accent:'var(--cat-academic)',      icon:'book' },
    { title:'Transport',  subtitle:'Bus routes and vehicle tracking',    category:'Management',    accent:'var(--cat-management)',    icon:'bus' },
    { title:'Hostel',     subtitle:'Room allotment and residents',       category:'Management',    accent:'var(--cat-management)',    icon:'home' },
    { title:'Payments',   subtitle:'Online payment gateway',             category:'Finance',       accent:'var(--cat-finance)',       icon:'card' },
    { title:'Fees',       subtitle:'Fee structure and collection',       category:'Finance',       accent:'var(--cat-finance)',       icon:'cash' },
    { title:'Accounts',   subtitle:'Ledgers and financial reports',      category:'Finance',       accent:'var(--cat-finance)',       icon:'wallet' },
    { title:'Settings',   subtitle:'System preferences and config',      category:'System',        accent:'var(--cat-system)',        icon:'gear' },
    { title:'Profile',    subtitle:'Your personal information',         category:'System',        accent:'var(--cat-system)',        icon:'user' },
    { title:'Messages',   subtitle:'Direct messages and chat',           category:'Communication', accent:'var(--cat-communication)', icon:'chat' },
    { title:'Calendar',   subtitle:'Events and important dates',         category:'Overview',      accent:'var(--cat-overview)',      icon:'calendar' },
    { title:'Reports',    subtitle:'Analytics and data exports',         category:'Management',    accent:'var(--cat-management)',    icon:'doc' }
  ];

  /* ---------------------------------------------------------
     ELEMENTS
  --------------------------------------------------------- */
  var searchRoot   = document.getElementById('searchRoot');
  var shell        = document.getElementById('searchShell');
  var toggleBtn    = document.getElementById('searchToggle');
  var input        = document.getElementById('searchInput');
  var clearBtn     = document.getElementById('clearBtn');
  var suggestPanel = document.getElementById('suggestPanel');
  var suggestList  = document.getElementById('suggestList');
  var resultsPanel = document.getElementById('resultsPanel');
  var liveRegion   = document.getElementById('liveRegion');

  var state = {
    expanded: false,
    suggestions: [],
    activeIndex: -1,
    suggestOpen: false,
    resultsOpen: false,
    loadingTimer: null
  };

  /* ---------------------------------------------------------
     HELPERS
  --------------------------------------------------------- */
  function escapeHtml(str){
    return str.replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function highlight(text, q){
    if(!q) return escapeHtml(text);
    var idx = text.toLowerCase().indexOf(q.toLowerCase());
    if(idx === -1) return escapeHtml(text);
    return escapeHtml(text.slice(0, idx)) + '<mark>' + escapeHtml(text.slice(idx, idx+q.length)) + '</mark>' + escapeHtml(text.slice(idx+q.length));
  }
  function matches(item, q){
    var s = q.toLowerCase();
    return item.title.toLowerCase().indexOf(s) !== -1 ||
           item.subtitle.toLowerCase().indexOf(s) !== -1 ||
           item.category.toLowerCase().indexOf(s) !== -1;
  }
  function createRipple(e, el){
    var rect = el.getBoundingClientRect();
    var ripple = document.createElement('span');
    ripple.className = 'ripple';
    var size = Math.max(rect.width, rect.height) * 1.6;
    var x = (e.clientX !== undefined ? e.clientX - rect.left : rect.width/2) - size/2;
    var y = (e.clientY !== undefined ? e.clientY - rect.top : rect.height/2) - size/2;
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    var prevPos = getComputedStyle(el).position;
    if(prevPos === 'static') el.style.position = 'relative';
    el.style.overflow = 'hidden';
    el.appendChild(ripple);
    ripple.addEventListener('animationend', function(){ ripple.remove(); });
  }

  /* ---------------------------------------------------------
     EXPAND / COLLAPSE
  --------------------------------------------------------- */
  function expandSearch(){
    if(state.expanded) return;
    state.expanded = true;
    shell.classList.add('expanded');
    toggleBtn.setAttribute('aria-expanded', 'true');
    toggleBtn.setAttribute('aria-label', 'Search open');
    input.classList.add('ph-fade');
    setTimeout(function(){
      input.focus();
      input.classList.remove('ph-fade');
    }, 260);
  }

  function collapseSearch(){
    if(!state.expanded) return;
    state.expanded = false;
    shell.classList.remove('expanded');
    toggleBtn.setAttribute('aria-expanded', 'false');
    toggleBtn.setAttribute('aria-label', 'Open search');
    input.blur();
    closeSuggestions();
    closeResults();
  }

  toggleBtn.addEventListener('click', function(e){
    createRipple(e, toggleBtn);
    if(!state.expanded){ expandSearch(); }
    else { input.focus(); }
  });

  shell.addEventListener('click', function(e){
    if(!state.expanded){ expandSearch(); }
  });
  shell.addEventListener('submit', function(e){ e.preventDefault(); });

  /* ---------------------------------------------------------
     SUGGESTIONS
  --------------------------------------------------------- */
  function openSuggestions(){
    if(state.suggestOpen) return;
    state.suggestOpen = true;
    suggestPanel.classList.add('show');
    input.setAttribute('aria-expanded', 'true');
  }
  function closeSuggestions(){
    state.suggestOpen = false;
    suggestPanel.classList.remove('show');
    input.setAttribute('aria-expanded', 'false');
    input.removeAttribute('aria-activedescendant');
    state.activeIndex = -1;
  }

  function renderSuggestions(query){
    var list = DATA.filter(function(item){ return matches(item, query); }).slice(0, 7);
    state.suggestions = list;
    state.activeIndex = -1;

    if(list.length === 0){
      suggestList.innerHTML = '<div class="no-sugg">No matches for &ldquo;' + escapeHtml(query) + '&rdquo;</div>';
      openSuggestions();
      return;
    }

    suggestList.innerHTML = list.map(function(item, i){
      return '' +
        '<div class="sugg-item" role="option" id="sugg-opt-'+i+'" data-index="'+i+'" aria-selected="false">' +
          '<span class="sugg-icon" style="--accent:'+item.accent+'">'+svg(item.icon)+'</span>' +
          '<span class="sugg-text">' +
            '<span class="sugg-title">'+highlight(item.title, query)+'</span>' +
            '<span class="sugg-sub">'+escapeHtml(item.subtitle)+'</span>' +
          '</span>' +
          '<span class="sugg-badge" style="--accent:'+item.accent+'">'+escapeHtml(item.category)+'</span>' +
        '</div>';
    }).join('');

    Array.prototype.forEach.call(suggestList.querySelectorAll('.sugg-item'), function(el){
      el.addEventListener('mouseenter', function(){ setActiveSuggestion(parseInt(el.dataset.index, 10)); });
      el.addEventListener('click', function(e){
        createRipple(e, el);
        selectSuggestion(list[parseInt(el.dataset.index, 10)]);
      });
    });

    openSuggestions();
  }

  function setActiveSuggestion(idx){
    state.activeIndex = idx;
    var items = suggestList.querySelectorAll('.sugg-item');
    items.forEach(function(el, i){
      var isActive = i === idx;
      el.classList.toggle('active', isActive);
      el.setAttribute('aria-selected', isActive ? 'true' : 'false');
    });
    if(idx >= 0 && items[idx]){
      input.setAttribute('aria-activedescendant', 'sugg-opt-' + idx);
      items[idx].scrollIntoView({ block: 'nearest' });
    } else {
      input.removeAttribute('aria-activedescendant');
    }
  }

  function selectSuggestion(item){
    input.value = item.title;
    closeSuggestions();
    performSearch(item.title);
  }

  /* ---------------------------------------------------------
     RESULTS
  --------------------------------------------------------- */
  function openResults(){
    state.resultsOpen = true;
    resultsPanel.classList.add('show');
  }
  function closeResults(){
    state.resultsOpen = false;
    resultsPanel.classList.remove('show');
    if(state.loadingTimer){ clearTimeout(state.loadingTimer); state.loadingTimer = null; }
  }

  function performSearch(query){
    query = query.trim();
    if(!query) return;
    closeSuggestions();

    resultsPanel.innerHTML =
      '<div class="state-loading">' +
        '<div class="loading-dots"><span></span><span></span><span></span></div>' +
        '<p>Searching for &ldquo;' + escapeHtml(query) + '&rdquo;&hellip;</p>' +
      '</div>';
    openResults();

    if(state.loadingTimer) clearTimeout(state.loadingTimer);
    state.loadingTimer = setTimeout(function(){
      renderResults(query);
    }, 550);
  }

  function renderResults(query){
    var results = DATA.filter(function(item){ return matches(item, query); });

    var header =
      '<div class="results-header">' +
        '<span>' + (results.length ? ('<b>' + results.length + '</b> result' + (results.length === 1 ? '' : 's') + ' for &ldquo;' + escapeHtml(query) + '&rdquo;') : 'Results') + '</span>' +
        '<button type="button" class="panel-close" id="resultsCloseBtn" aria-label="Close results">&times;</button>' +
      '</div>';

    if(results.length === 0){
      resultsPanel.innerHTML = header +
        '<div class="state-empty">' +
          '<span class="empty-icon">' + svg('searchOff') + '</span>' +
          '<h4>No results found</h4>' +
          '<p>We couldn&rsquo;t find anything for &ldquo;' + escapeHtml(query) + '&rdquo;. Try checking your spelling or use a different keyword.</p>' +
          '<div class="empty-suggestions">' +
            '<span>Try:</span>' +
            '<button type="button" class="chip" data-fill="Dashboard">Dashboard</button>' +
            '<button type="button" class="chip" data-fill="Fees">Fees</button>' +
            '<button type="button" class="chip" data-fill="Library">Library</button>' +
          '</div>' +
        '</div>';
      liveRegion.textContent = 'No results found for ' + query;
    } else {
      var cards = results.map(function(item, i){
        return '' +
          '<article class="result-card" tabindex="0" data-index="'+i+'" style="animation-delay:'+(i*45)+'ms">' +
            '<span class="result-icon" style="--accent:'+item.accent+'">'+svg(item.icon)+'</span>' +
            '<span class="result-body">' +
              '<span class="result-top">' +
                '<h4 class="result-title">'+highlight(item.title, query)+'</h4>' +
                '<span class="result-badge" style="--accent:'+item.accent+'">'+escapeHtml(item.category)+'</span>' +
              '</span>' +
              '<p class="result-desc">'+escapeHtml(item.subtitle)+'</p>' +
            '</span>' +
            '<span class="result-arrow">&rarr;</span>' +
          '</article>';
      }).join('');
      resultsPanel.innerHTML = header + '<div class="results-list">' + cards + '</div>';
      liveRegion.textContent = results.length + ' results found for ' + query;

      requestAnimationFrame(function(){
        Array.prototype.forEach.call(resultsPanel.querySelectorAll('.result-card'), function(el){
          el.classList.add('stagger-in');
          el.addEventListener('click', function(e){ createRipple(e, el); });
          el.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ createRipple(e, el); } });
        });
      });
    }

    var closeBtn = document.getElementById('resultsCloseBtn');
    if(closeBtn){ closeBtn.addEventListener('click', function(e){ createRipple(e, closeBtn); closeResults(); }); }
    Array.prototype.forEach.call(resultsPanel.querySelectorAll('.chip'), function(chip){
      chip.addEventListener('click', function(e){
        createRipple(e, chip);
        var val = chip.dataset.fill;
        input.value = val;
        performSearch(val);
      });
    });
  }

  /* ---------------------------------------------------------
     INPUT EVENTS
  --------------------------------------------------------- */
  input.addEventListener('input', function(){
    var q = input.value;
    clearBtn.classList.toggle('show', q.length > 0);

    shell.classList.remove('typing-glow');
    void shell.offsetWidth;
    shell.classList.add('typing-glow');

    if(q.trim().length > 0){
      renderSuggestions(q.trim());
      closeResults();
    } else {
      closeSuggestions();
      closeResults();
    }
  });

  input.addEventListener('keydown', function(e){
    if(e.key === 'ArrowDown'){
      if(state.suggestOpen && state.suggestions.length){
        e.preventDefault();
        var next = state.activeIndex < state.suggestions.length - 1 ? state.activeIndex + 1 : 0;
        setActiveSuggestion(next);
      }
    } else if(e.key === 'ArrowUp'){
      if(state.suggestOpen && state.suggestions.length){
        e.preventDefault();
        var prev = state.activeIndex > 0 ? state.activeIndex - 1 : state.suggestions.length - 1;
        setActiveSuggestion(prev);
      }
    } else if(e.key === 'Enter'){
      e.preventDefault();
      if(state.suggestOpen && state.activeIndex >= 0 && state.suggestions[state.activeIndex]){
        selectSuggestion(state.suggestions[state.activeIndex]);
      } else if(input.value.trim().length > 0){
        performSearch(input.value);
      }
    } else if(e.key === 'Escape'){
      e.preventDefault();
      if(state.suggestOpen){ closeSuggestions(); }
      else if(state.resultsOpen){ closeResults(); }
      else { collapseSearch(); }
    }
  });

  clearBtn.addEventListener('click', function(e){
    createRipple(e, clearBtn);
    input.value = '';
    clearBtn.classList.remove('show');
    closeSuggestions();
    closeResults();
    input.focus();
  });

  /* ---------------------------------------------------------
     GLOBAL: outside click, "/" shortcut
  --------------------------------------------------------- */
  document.addEventListener('click', function(e){
    if(!searchRoot.contains(e.target)){
      closeSuggestions();
      closeResults();
      if(input.value.trim() === ''){ collapseSearch(); }
    }
  });

  document.addEventListener('keydown', function(e){
    if(e.key === '/' && document.activeElement !== input){
      var tag = document.activeElement ? document.activeElement.tagName : '';
      if(tag !== 'INPUT' && tag !== 'TEXTAREA'){
        e.preventDefault();
        expandSearch();
      }
    }
  });

})();
</script>
</body>
